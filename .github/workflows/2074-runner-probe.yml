name: PR 2074 batch-15 build and Comparator

on:
  push:
    branches: [proof-ci/2074-runner-probe]

permissions: {}

env:
  RH_BASE: 246656fc62ac80c1214f48550138076c4f278569
  RH_CANDIDATE: 6829e6a0965ca15316f564254c158d563a347cc7
  LEAN_ABORT_ON_PANIC: '1'
  LEAN_NUM_THREADS: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Prepare disposable build filesystem
        shell: bash
        run: |
          set -euo pipefail
          slot="$RUNNER_TEMP/lean-build-data"
          mkdir -p "$slot/mnt"
          gib=$((1024 ** 3))
          available=$(df -B1 --output=avail "$slot" | tail -n 1)
          if ((available < 72 * gib)); then
            printf 'Runner backing filesystem has %s free bytes. The cache, export and swap budget needs 72 GiB.\n' "$available" >&2
            exit 2
          fi
          if ! command -v mkfs.btrfs >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq btrfs-progs
          fi
          available=$(df -B1 --output=avail "$slot" | tail -n 1)
          volume=$((available - 20 * gib))
          if ((volume > 60 * gib)); then volume=$((60 * gib)); fi
          fallocate -l "$volume" "$slot/cache.btrfs"
          mkfs.btrfs -q "$slot/cache.btrfs"
          sudo mount -o loop,compress-force=zstd:3 "$slot/cache.btrfs" "$slot/mnt"
          sudo chown "$(id -u):$(id -g)" "$slot/mnt"
          sudo sysctl -w vm.max_map_count=1048576
          fallocate -l 12G "$slot/proof.swap"
          chmod 600 "$slot/proof.swap"
          sudo mkswap "$slot/proof.swap"
          sudo swapon "$slot/proof.swap"
          printf 'RH_WORK=%s\n' "$slot/mnt" >> "$GITHUB_ENV"
          df -h "$slot" "$slot/mnt"
          free -h

      - name: Checkout exact base and install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RH_WORK/project" "$RH_WORK/toolchain"
          git -C "$RH_WORK/project" init -q
          git -C "$RH_WORK/project" remote add origin https://github.com/seanyang0813/riemann-hypothesis.git
          git -C "$RH_WORK/project" config remote.origin.promisor true
          git -C "$RH_WORK/project" config remote.origin.partialclonefilter blob:none
          git -C "$RH_WORK/project" fetch --depth=1 --filter=blob:none origin "$RH_BASE" "$RH_CANDIDATE"
          git -C "$RH_WORK/project" checkout --detach "$RH_BASE"
          test "$(git -C "$RH_WORK/project" rev-parse HEAD)" = "$RH_BASE"
          test "$(cat "$RH_WORK/project/lean-toolchain")" = 'leanprover/lean4:v4.37.0-rc1'
          archive="$RH_WORK/lean-4.37.0-rc1-linux.tar.zst"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.37.0-rc1/lean-4.37.0-rc1-linux.tar.zst -o "$archive"
          printf '2e1bbb832870bb81b7131cb70b13aec2cc7ed9f22e2bdbb236b86076ae20382d  %s\n' "$archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$RH_WORK/toolchain" --strip-components=1
          unlink "$archive"
          "$RH_WORK/toolchain/bin/lean" --version | tee "$RH_WORK/lean-version.txt"
          grep -F 'commit 0b77e12952ad39077d80d8bd6b66d601f225c321' "$RH_WORK/lean-version.txt"
          mkdir "$RH_WORK/elan-installer"
          elan_archive="$RH_WORK/elan-installer/elan.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz -o "$elan_archive"
          printf '0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  %s\n' "$elan_archive" | sha256sum --check
          tar -xzf "$elan_archive" -C "$RH_WORK/elan-installer"
          export ELAN_HOME="$RH_WORK/elan"
          "$RH_WORK/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          export ELAN_TOOLCHAIN=leanprover/lean4:v4.37.0-rc1
          "$ELAN_HOME/bin/elan" toolchain link "$ELAN_TOOLCHAIN" "$RH_WORK/toolchain"
          resolved=$("$ELAN_HOME/bin/elan" which lean)
          test "$(readlink -f "$resolved")" = "$RH_WORK/toolchain/bin/lean"
          test -x "$(dirname "$resolved")/leantar"
          printf 'ELAN_HOME=%s\n' "$ELAN_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$RH_WORK/toolchain/bin" >> "$GITHUB_PATH"
          printf 'LEAN_SYSROOT=%s\n' "$RH_WORK/toolchain" >> "$GITHUB_ENV"

      - name: Restore and verify the stock baseline cache
        shell: bash
        run: |
          set -euo pipefail
          cd "$RH_WORK/project"
          /usr/bin/time -v lake exe cache get 2>&1 | tee "$RH_WORK/cache-restore.log"
          lake -q --log-level=error build --no-build
          printf 'Baseline cache verified at %s\n' "$(git rev-parse HEAD)"
          df -h "$RH_WORK"
          sudo btrfs filesystem usage -b "$RH_WORK"

      - name: Build the complete candidate with Lake
        shell: bash
        run: |
          set -euo pipefail
          cd "$RH_WORK/project"
          git checkout --detach "$RH_CANDIDATE"
          test "$(git rev-parse HEAD)" = "$RH_CANDIDATE"
          git diff --check "$RH_BASE" "$RH_CANDIDATE"
          git diff --exit-code "$RH_BASE" "$RH_CANDIDATE" -- \
            src/Main.lean src/Statements.lean src/Challenge.lean comparator.json export-targets.txt comparator \
            lean-toolchain lakefile.toml lake-manifest.json
          /usr/bin/time -v lake -q build 2>&1 | tee "$RH_WORK/candidate-build.log"
          test "$(git rev-parse HEAD)" = "$RH_CANDIDATE"
          lake -q --log-level=error build --no-build
          printf 'Full Lake build succeeded at %s\n' "$RH_CANDIDATE"

      - name: Inspect the five compiled Main declarations
        shell: bash
        run: |
          set -euo pipefail
          cd "$RH_WORK/project"
          cat > "$RH_WORK/MainAudit.lean" <<'LEAN'
          module
          import Main
          #check @riemannHypothesis
          #check @riemannZeta_eq_zero_re
          #check @LFunction_ne_zero_of_half_lt_re
          #check @LFunction_eq_zero_re
          #check @LFunction_eq_zero_re_of_isPrimitive
          #print axioms riemannHypothesis
          #print axioms riemannZeta_eq_zero_re
          #print axioms LFunction_ne_zero_of_half_lt_re
          #print axioms LFunction_eq_zero_re
          #print axioms LFunction_eq_zero_re_of_isPrimitive
          LEAN
          lake env lean -j 1 --tstack=400000 "$RH_WORK/MainAudit.lean" | tee "$RH_WORK/main-axioms.log"
          python3 - "$RH_WORK/main-axioms.log" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text()
          names = {"riemannHypothesis", "riemannZeta_eq_zero_re", "LFunction_ne_zero_of_half_lt_re",
                   "LFunction_eq_zero_re", "LFunction_eq_zero_re_of_isPrimitive"}
          permitted = {"propext", "Quot.sound", "Classical.choice"}
          rows = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          assert len(rows) == len(names) and {name for name, _ in rows} == names, text
          for name, axioms in rows:
              actual = {axiom.strip() for axiom in axioms.split(",") if axiom.strip()}
              assert actual <= permitted, (name, actual - permitted)
          print("All five compiled Main declarations satisfy the permitted axiom policy")
          PY

      - name: Export the challenge and full Main proof
        shell: bash
        run: |
          set -euo pipefail
          cd "$RH_WORK/project"
          lake -q build Challenge
          mkdir -p "$RH_WORK/comparator"
          original_lean_path=$(lake env printenv LEAN_PATH)
          filtered_path=$(python3 - "$RH_WORK" "$LEAN_SYSROOT" "$original_lean_path" <<'PY'
          from pathlib import Path
          import os
          import sys

          work, sysroot = map(Path, sys.argv[1:3])
          roots = [Path(p) for p in sys.argv[3].split(os.pathsep) if p]
          roots.append(sysroot / "lib/lean")
          exported = []
          for idx, root in enumerate(roots):
              root = root.resolve(strict=True)
              outer = work / "olean-only" / str(idx)
              outer.mkdir(parents=True)
              exported.append(outer)
              for directory, _, names in os.walk(root):
                  source = Path(directory)
                  target = outer / source.relative_to(root)
                  for name in names:
                      if name.endswith((".olean", ".olean.server", ".olean.private")):
                          target.mkdir(parents=True, exist_ok=True)
                          (target / name).symlink_to(source / name)
          print(os.pathsep.join(map(str, exported)))
          PY
          )
          mapfile -t targets < <(tr -s '[:space:]' '\n' < export-targets.txt | grep -v '^$')
          test "${#targets[@]}" -gt 20
          export LEAN_PATH="$filtered_path"
          /usr/bin/time -v timeout 20m "$LEAN_SYSROOT/bin/leanexport" Challenge -- "${targets[@]}" \
            > "$RH_WORK/comparator/challenge.export"
          test -s "$RH_WORK/comparator/challenge.export"
          stat -c 'Challenge export has %s bytes' "$RH_WORK/comparator/challenge.export"
          (
            ulimit -f 67108864
            /usr/bin/time -v timeout 135m "$LEAN_SYSROOT/bin/leanexport" Main -- "${targets[@]}" \
              > "$RH_WORK/comparator/solution.export"
          )
          test -s "$RH_WORK/comparator/solution.export"
          stat -c 'Main export has %s bytes' "$RH_WORK/comparator/solution.export"
          df -h "$RH_WORK"

      - name: Run the unchanged Comparator in its sandbox
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap
          fi
          if ! bwrap --unshare-all --ro-bind / / --dev /dev /bin/true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            bwrap --unshare-all --ro-bind / / --dev /dev /bin/true
          fi
          mkdir "$RH_WORK/empty"
          cd "$RH_WORK/empty"
          /usr/bin/time -v timeout 130m lake comparator --json \
            --config "$RH_WORK/project/comparator.json" \
            --challenge-from-export "$RH_WORK/comparator/challenge.export" \
            --solution-from-export "$RH_WORK/comparator/solution.export" \
            | tee "$RH_WORK/comparator/report.json"

      - name: Release disposable swap and filesystem
        if: always()
        shell: bash
        run: |
          slot="$RUNNER_TEMP/lean-build-data"
          mount="$slot/mnt"
          if swapon --show=NAME --noheadings | grep -Fx "$slot/proof.swap"; then
            sudo swapoff "$slot/proof.swap"
          fi
          if mountpoint -q "$mount"; then
            df -h "$mount"
            sudo btrfs filesystem usage -b "$mount"
            sudo umount "$mount"
          fi
